services:
  mysql:
    image: mysql:8.0
    container_name: demo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: book_rental
      MYSQL_USER: demo
      MYSQL_PASSWORD: demo
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306" # 로컬에 설치된 MySQL이 3306을 쓰고 있어서 3307로 노출
    volumes:
      - ./src/main/java/com/example/demo/sql:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
